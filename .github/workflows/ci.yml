name: CI

on:
  push:
    # 触发集合见 cadence/project-rules/ci-trigger-gating.md：
    # 代码（install.sh/tests/工作流自身）与 Skills 源（cadence-init/**，
    # 含 rule-config 规则模板）。.claude/rules/ 为 /rule-config 生成的受管
    # 投影，不单独触发；纯文档变更（README/readmes/cadence/openspec 等）不触发。
    paths:
      - "install.sh"
      - "tests/**"
      - "cadence-init/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "install.sh"
      - "tests/**"
      - "cadence-init/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  checks:
    name: ShellCheck、隔离集成测试与 13×3 链接矩阵
    runs-on: ubuntu-latest
    # 本工作流只验证脚本与链接 fixture，不启动真实四客户端 CLI job。
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 ShellCheck
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes shellcheck
          shellcheck --version

      - name: ShellCheck
        run: shellcheck --shell=bash --severity=warning install.sh tests/test-install.sh

      - name: 隔离 HOME 集成测试
        run: |
          set -euo pipefail
          test_home="$(mktemp -d "${TMPDIR:-/tmp}/cadence-ci-test.XXXXXX")"
          trap 'rm -rf -- "$test_home"' EXIT
          HOME="$test_home" bash tests/test-install.sh

      - name: 13×3 链接解析 fixture 矩阵
        run: |
          set -euo pipefail
          matrix_home="$(mktemp -d "${TMPDIR:-/tmp}/cadence-ci-matrix.XXXXXX")"
          trap 'rm -rf -- "$matrix_home"' EXIT
          export HOME="$matrix_home"

          shared_root="$HOME/.agents/skills"
          claude_root="$HOME/.claude/skills"
          codex_root="$HOME/.codex/skills"
          mkdir -p "$shared_root" "$claude_root" "$codex_root"

          # 三端可移植：不使用 bash 4 的 mapfile，也不用 GNU 专有的 find -printf
          skills="$(find cadence-init/skills -mindepth 2 -maxdepth 2 -type f -name SKILL.md \
            | sed 's#/SKILL.md$##' | sed 's#^.*/##' | sort -u | tr '\n' ' ')"
          skill_count="$(printf '%s\n' $skills | grep -c .)"
          test "$skill_count" -eq 15   # 14 基线 + knowledge-base-user-input（2026-11-10 新增）

          for skill in $skills; do
            source_skill="$GITHUB_WORKSPACE/cadence-init/skills/$skill"
            test -f "$source_skill/SKILL.md"
            ln -s "$source_skill" "$shared_root/$skill"
            ln -s "$shared_root/$skill" "$claude_root/$skill"
            ln -s "$shared_root/$skill" "$codex_root/$skill"
          done

          # 第三方形状链：共享层不是 Cadence 源，两个客户端层仅投影共享层。
          third_party_name=third-party-shape
          third_party_skill="$HOME/.agents/superpowers/skills/$third_party_name"
          mkdir -p "$third_party_skill"
          printf 'third-party fixture\n' > "$third_party_skill/SKILL.md"
          ln -s "$third_party_skill" "$shared_root/$third_party_name"
          ln -s "$shared_root/$third_party_name" "$claude_root/$third_party_name"
          ln -s "$shared_root/$third_party_name" "$codex_root/$third_party_name"

          # 用户普通目录必须保持为普通目录，不被链接矩阵误判为受管链。
          ordinary_name=user-owned-directory
          ordinary_dir="$shared_root/$ordinary_name"
          mkdir -p "$ordinary_dir"
          printf 'keep\n' > "$ordinary_dir/keep"

          # dangling 链必须仍是链接并保持 dangling，不能因无法证明所有权而删除。
          dangling_name=dangling-shape
          dangling_target="$HOME/not-created/$dangling_name"
          ln -s "$dangling_target" "$shared_root/$dangling_name"
          ln -s "$shared_root/$dangling_name" "$claude_root/$dangling_name"
          ln -s "$shared_root/$dangling_name" "$codex_root/$dangling_name"

          link_checks=0
          for skill in $skills; do
            test -L "$shared_root/$skill"
            test -L "$claude_root/$skill"
            test -L "$codex_root/$skill"
            test -f "$shared_root/$skill/SKILL.md"
            test -f "$claude_root/$skill/SKILL.md"
            test -f "$codex_root/$skill/SKILL.md"
            link_checks=$((link_checks + 3))
          done
          test "$link_checks" -eq $((skill_count * 3))   # 随技能数自动伸缩（此前硬编码 13*3）

          test -L "$shared_root/$third_party_name"
          test -L "$claude_root/$third_party_name"
          test -L "$codex_root/$third_party_name"
          test -f "$shared_root/$third_party_name/SKILL.md"
          test -f "$claude_root/$third_party_name/SKILL.md"
          test -f "$codex_root/$third_party_name/SKILL.md"
          test -d "$ordinary_dir"
          test ! -L "$ordinary_dir"
          test -f "$ordinary_dir/keep"
          test -L "$shared_root/$dangling_name"
          test -L "$claude_root/$dangling_name"
          test -L "$codex_root/$dangling_name"
          test ! -e "$shared_root/$dangling_name"
          test ! -e "$claude_root/$dangling_name"
          test ! -e "$codex_root/$dangling_name"
          printf '15×3 links resolved; third-party, ordinary directory, and dangling fixtures preserved\n'

      - name: 安装 rule-config 测试依赖
        run: python3 -m pip install --user pytest pyyaml

      - name: 安装 codegraph（rule-config e2e S8 依赖，缺失则 overall=degraded）
        run: sudo npm install -g @colbymchenry/codegraph

      - name: rule-config 单元测试（pytest）
        run: |
          set -euo pipefail
          python3 -m pytest cadence-init/skills/rule-config/tests/test_rule_config.py -q

      - name: 全部 Python 测试（unittest）
        run: |
          set -euo pipefail
          for d in \
            cadence-init/skills/rule-config/tests \
            cadence-init/skills/project-rules-examples/tests \
            cadence-init/skills/mcp-configuration/tests \
            cadence-init/skills/pre-check/tests; do
            python3 -m unittest discover -s "$d" -p 'test_*.py'
          done

      - name: project-rules 与 pre-check shell 测试
        run: |
          set -euo pipefail
          bash cadence-init/skills/project-rules-examples/tests/test-apply.sh
          bash cadence-init/skills/pre-check/scripts/test.sh

  checks-macos:
    name: macOS 三端门禁（bash 3.2 + BSD 工具）
    runs-on: macos-latest
    # 三端门禁（cadence/project-rules/three-platform-gating.md）：安装器与隔离测试套件
    # 必须同时在 Linux 与 macOS runner 跑通。macos-latest 自带 bash 3.2 + BSD 工具链，
    # 这里的失败即三端兼容违例（GNU 专有选项、bash 4+ 语法等）。
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 记录工具链基线
        run: |
          set -euo pipefail
          /bin/bash --version | head -1
          command -v cksum

      - name: 环境自检（mktemp 模板与 bash 版本）
        run: |
          set -euo pipefail
          /bin/bash --version
          probe="$(mktemp -d "${TMPDIR:-/tmp}/cadence-ci-probe.XXXXXX")"
          printf 'mktemp ok: %s\n' "$probe"
          rm -rf -- "$probe"

      - name: 隔离 HOME 集成测试（bash 3.2 + BSD 工具）
        run: |
          set -uo pipefail
          test_home="$(mktemp -d "${TMPDIR:-/tmp}/cadence-ci-macos.XXXXXX")"
          trap 'rm -rf -- "$test_home"' EXIT
          # 捕获输出再判定退出码：失败时把用例输出打进 CI 日志，避免静默失败
          out="$(HOME="$test_home" /bin/bash tests/test-install.sh 2>&1)"
          status=$?
          printf '%s\n' "$out"
          if [ "$status" -ne 0 ]; then
            printf -- '--- 失败复现：bash -x 跟踪尾部 ---\n' >&2
            HOME="$test_home" /bin/bash -x tests/test-install.sh 2>&1 | tail -40 >&2
          fi
          exit "$status"

      - name: 安装器 dry-run（bash 3.2）
        run: |
          set -euo pipefail
          test_home="$(mktemp -d "${TMPDIR:-/tmp}/cadence-ci-macos-dry.XXXXXX")"
          trap 'rm -rf -- "$test_home"' EXIT
          HOME="$test_home" /bin/bash install.sh --dry-run
