name: Eval CI

on:
  pull_request:
    paths:
      - "eval/**"
      - "cadence-init/skills/pre-check/**"
      - "cadence-init/skills/rule-config/**"
      - "cadence-init/skills/mcp-configuration/**"
      - "cadence-init/skills/project-rules-examples/**"
      - ".github/workflows/eval.yml"
  push:
    branches: [main]
    paths:
      - "eval/**"
      - "cadence-init/skills/pre-check/**"
      - "cadence-init/skills/rule-config/**"
      - "cadence-init/skills/mcp-configuration/**"
      - "cadence-init/skills/project-rules-examples/**"
      - ".github/workflows/eval.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval-tier0:
    name: Tier-0 零真实 CLI（单测 + mock 冒烟 + 离线重跑）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: eval 单元测试（unittest 全量）
        run: |
          set -euo pipefail
          python3 -m unittest discover -s eval/tests -t . -v

      - name: mock 冒烟（阶段一四端全绿）
        run: |
          set -euo pipefail
          python3 -m eval.runner.cli smoke

      - name: 离线重跑（断言器回归防线）
        run: |
          set -euo pipefail
          python3 -m eval.runner.cli rerun \
            --transcripts eval/transcripts \
            --golden eval/transcripts/golden-verdicts.json

  eval-tier1-docker:
    name: Tier-1 Docker 四端夜测（self-hosted，PR 触发）
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: [self-hosted, cadence-eval]
    timeout-minutes: 180
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 环境自检（Podman/镜像/Python3）
        run: |
          set -euo pipefail
          podman --version
          python3 --version
          podman image exists localhost/cadence-test:latest \
            || podman build -t cadence-test:latest eval/docker/

      - name: 四端 Docker 夜测（全新容器×端：安装→四命令→探针→评分→销毁）
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          for agent in codex pi kimi claude; do
            echo "::group::夜测 ${agent}"
            PYTHONPATH=. python3 eval/docker/night.py "${agent}" P1,P3,P5
            echo "::endgroup::"
          done

      - name: 透视汇总（端×探针成功率/均时 + 基线降级检测）
        if: always()
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          PYTHONPATH=. python3 eval/docker/report_matrix.py --day all \
            | tee matrix.md >> "${GITHUB_STEP_SUMMARY}" || true

      - name: 上传夜测结果（失败诊断用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-night-results
          path: |
            matrix.md
            eval/results/docker-night/reports/nightly/
          retention-days: 14
          if-no-files-found: ignore
