# 无 sock 覆盖文件——敏感场景关闭 agent 的中间件启停通道。
# 用法：docker compose -f stack/compose.yaml -f stack/docker-compose.no-sock.yml up -d
# volumes 用 !override 整体替换，因为 compose 默认追加合并列表，无法移除已有挂载。
services:
  devbox:
    volumes: !override
      - ".:/cadence/stack"
      - "../cadence-box.yaml:/cadence/auth.yaml:ro"
      - "${CADENCE_WORKSPACE:?请在 stack/.env 设置 CADENCE_WORKSPACE}:/workspace"
      - cadence-claude:/home/dev/.claude
      - cadence-codex:/home/dev/.codex
      - cadence-pi:/home/dev/.pi/agent
      - cadence-kimi:/home/dev/.kimi-code
      - cadence-agents:/home/dev/.agents
      - cadence-omp:/home/dev/.omp
      - cadence-m2:/home/dev/.m2
      - cadence-npm:/home/dev/.npm
      - cadence-npm-global:/home/dev/.npm-global
      - cadence-uv:/home/dev/.cache/uv
      - cadence-pip:/home/dev/.cache/pip
      - cadence-gradle:/home/dev/.gradle
